<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Escáner Facial - Azul Sólido</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Forzamos el color azul directamente aquí para evitar que se vea blanco si falla la carga del CSS externo */
    html, body {
      background-color: #0a4fd1 !important;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <div class="frame">
    <!-- Contenedor flexible principal -->
    <div class="cont">
      <!-- Logo y Avatar -->
      <div class="izq">
        <img class="logo" src="assets/image/logo3.png" alt="Logo">
        <img class="avatar" src="assets/image/imagen-foto.webp" alt="Avatar">
      </div>

      <!-- Sección de Identidad y Visor -->
      <div class="centro">
        <p class="nombre">ANGEL ANDRES ESCOBAR TRAVI</p>

        <div class="visor">
          <!-- Foto estática de respaldo -->
          <img class="foto" src="assets/image/reconocimiento-png.webp" alt="Foto Reconocimiento">
          
          <!-- Cámara web en vivo -->
          <video class="cam" autoplay playsinline muted></video>

          <!-- Interfaz de Escáner HUD -->
          <div class="scan">
            <i class="c tl"></i><i class="c tr"></i>
            <i class="c bl"></i><i class="c br"></i>
            <b class="linea"></b>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const foto = document.querySelector('.foto');
    const cam  = document.querySelector('.cam');

    /* La cámara se abre sola al cargar la página en cualquier dispositivo */
    (async () => {
      try {
        cam.srcObject = await navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: 'user' } 
        });
        cam.style.display  = 'block';
        foto.style.display = 'none';
      } catch (e) {
        console.log('Permite el acceso a la cámara para escanear el rostro');
      }
    })();
  </script>

</body>
</html>
