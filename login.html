<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Iniciar sesión</title>
  <link rel="icon" type="image1.png" href="assets/image/image1.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/login.css">
</head>
<body>

<div class="frame">
  <img class="logo" src="assets/image/logo1.png" alt="ESA">

  <form onsubmit="location.href='tabla.html'; return false">
    <h1>INICIAR SESIÓN</h1>

    <label for="correo">CORREO ELECTRÓNICO:</label>
    <div class="campo">
      <i class="fa-regular fa-envelope"></i>
      <input id="correo" type="email" placeholder="ejemplo@gmail.com" required>
    </div>

    <label for="clave">CONTRASEÑA:</label>
    <div class="campo">
      <i class="fa-solid fa-lock"></i>
      <input id="clave" type="password" placeholder="Ingrese su contraseña" required>
    </div>

    <button>INGRESAR</button>
  </form>
</div>

</body>
</html>
